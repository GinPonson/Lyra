org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47 模板默认值:newDsl=false 与 builtInKotlin=false 必须同时保留。
# Flutter 3.47.2 的 flutter-gradle-plugin 依赖旧 DSL 接口转型(newDsl=true 时
# 在 :app 报 AbstractAppExtension cast 失败);android.builtInKotlin 单独改 true
# 也会让 :app 的 Kotlin DSL 访问器失效。Kotlin DSL 插件兼容性见 pubspec.yaml
# 的 file_selector_android 覆盖说明(2026-09-05)。
android.newDsl=false
android.builtInKotlin=false
